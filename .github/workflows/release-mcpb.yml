name: Build .mcpb release artifact

on:
  push:
    tags: ['v*']

jobs:
  build-mcpb:
    name: Build .mcpb bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for gh release upload
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # npm-publish.yml enforces the same invariant, but each workflow triggers
      # independently off the tag push — without this gate, a tag on a commit
      # with stale manifests ships a public GitHub Release carrying a mismatched
      # bundle while the npm job fails beside it.
      - name: Check the release identity
        run: node scripts/check-publish-identity.cjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build .mcpb
        run: make mcpb

      - name: Create GitHub Release (if not exists)
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .mcpb artifact to release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" salesforce-cloud-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
